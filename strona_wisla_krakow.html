<!DOCTYPE html>
<html>
<head><meta charset="....">
<title> Typowa witryna internetowa </title>
<style type="text/css">
		*	{
			box-sizing;
			border-box;
			}
		body{ 
			background: red;
			padding: 20px;
			}
	header  {
			border: 3px solid white;
			width: 100%;
			background: black; 
			padding: 30px;
			color: white;
			}
		nav {
			border: 1px solid white;
			width: 50%;
			padding: 20px;
			background: black;
			color: white;
			}
	   main {
			float: left;
			width: 60%;
			margin-top: 2%;
			background: black;
			margin-bottom: 2%;
			color: white;
			}
	section {
			border: 1px solid white;
			margin-bottom: 4%;
			background: black;
			color: white;
			}
	article {
			border: 1px solid white;
			color: white;
			}
	  aside { 
			padding-left: 2%;
			margin-top: 2%;
			width: 38%;
			float: right;
			color: white;
			}
	 footer {
			border: 1px solid white;
			width: 100%;
			clear: both;
			padding: 20px;
			background: black;
			color: white;
			}
</head>
</style>
<body>

			
			

	
	<header>
		<h1> Typowa witryna internetowa </h1>
			<nav> 
				 <ul>
				<li><a href="#"> Strona gtówna</a></li>
				<li><a href="#"> Produkty </a></li>
				<li><a href="#">O nas </a></li>
				<li><a href="#"> Kontakt </a></li>
				 </ul>
			</nav>
	</header>
	
	<main>
		<article>
			<h2> Nagtówek </h2>
			<p> To jest tekst artykutu. </p>
			<p> Kolejny tekst artykutu.</p>
		</article>
	</main>
	
	<aside>
		<section><p>SEKCJA</p></section>
		<section><p>SEKCJA</p></section>
		<section><p>SEKCJA</p></section>
	</aside>

	<footer> Copyright 2018 </footer></div>
</body></html>
